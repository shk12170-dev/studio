<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moment AI 스튜디오</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    
    body { 
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8) 0%, rgba(220, 230, 245, 0.6) 100%),
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed;
      color: #2d3748; 
      padding: 30px 20px; 
      perspective: 1000px;
    }

    .app-header { 
      max-width: 1300px; 
      margin: 0 auto 28px; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 18px 28px; 
      border-radius: 20px; 
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .app-header h2 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #3182ce, #805ad5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .main-layout { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 420px 1fr; gap: 28px; }
    
    .panel { 
      background: rgba(255, 255, 255, 0.82); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 24px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1), inset 0 1px 2px rgba(255, 255, 255, 1);
      max-height: 85vh; 
      overflow-y: auto; 
    }
    .panel h3 { font-size: 14px; font-weight: 800; margin-bottom: 14px; color: #4a5568; border-bottom: 2px solid rgba(226, 232, 240, 0.8); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .section { margin-bottom: 22px; }
    
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #4a5568; }
    input[type="text"], input[type="number"], select, textarea { 
      width: 100%; 
      padding: 10px 12px; 
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #cbd5e0; 
      border-radius: 12px; 
      font-size: 13px; 
      margin-bottom: 10px; 
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
    }
    input[type="range"] { width: 100%; margin-bottom: 10px; accent-color: #3182ce; }
    
    button { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, #3182ce, #2b6cb0); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-bottom: 8px; 
      transition: all 0.15s ease; 
      font-size: 13px; 
      box-shadow: 0 6px 14px rgba(49, 130, 206, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }
    button:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(49, 130, 206, 0.4); }
    button:active { transform: translateY(1px); }
    
    .btn-secondary { background: linear-gradient(135deg, #edf2f7, #e2e8f0); color: #4a5568; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06); border: 1px solid #cbd5e0; }
    .btn-danger { background: linear-gradient(135deg, #e53e3e, #c53030); box-shadow: 0 6px 14px rgba(229, 62, 62, 0.35); }
    .btn-group { display: flex; gap: 8px; }

    .preview-area { 
      background: rgba(255, 255, 255, 0.82); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 24px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
    }

    .canvas-wrapper { 
      position: relative; 
      border-radius: 16px; 
      overflow: hidden;
      background: #111827; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      max-width: 100%; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 8px rgba(255, 255, 255, 0.4);
    }
    canvas { display: block; max-width: 100%; max-height: 65vh; object-fit: contain; }

    #toast { margin-top: 12px; padding: 10px; border-radius: 10px; font-size: 12px; text-align: center; display: none; font-weight: 600; }
    .toast-success { background: #c6f6d5; color: #22543d; }
    .toast-error { background: #fed7d7; color: #742a2a; }
  </style>
</head>
<body>

<div class="app-header">
  <h2>🎨 소중한 순간이 빛날 수 있도록 기록해보세요. Moment AI 스튜디오</h2>
</div>

<div class="main-layout">
  <!-- 좌측 컨트롤 패널 -->
  <div class="panel">
    
    <!-- 1. 이미지 업로드 -->
    <div class="section">
      <h3>1. 이미지 등록 (EXIF 자동 제거)</h3>
      <input type="file" id="imageInput" accept="image/png, image/jpeg">
    </div>

    <!-- 2. AI 문구 추천 -->
    <div class="section">
      <h3>2. AI 문구 추천 Engine</h3>
      <label>주제 테마 선택</label>
      <select id="themeSelect">
        <option value="daily">🏠 일상/소소한 행복</option>
        <option value="travel">✈️ 여행/풍경</option>
        <option value="activity">🧗‍♂️ 액티비티/도전</option>
        <option value="healing">🌿 힐링/휴식</option>
        <option value="food">🍕 음식/맛집</option>
        <option value="motivation">🔥 동기부여/명언</option>
      </select>
      <button onclick="generateAIMessageOnly()">✍️ AI 문구 추천받기</button>
    </div>

    <!-- 3. 화면비 및 텍스트 편집 -->
    <div class="section">
      <h3>3. 화면비 및 문구 디테일 편집</h3>
      <label>화면 비율 (1:1 / 4:5 / 9:16)</label>
      <select id="ratioSelect">
        <option value="1:1">1:1 (정사각형)</option>
        <option value="4:5">4:5 (인스타 피드)</option>
        <option value="9:16">9:16 (스토리/릴스)</option>
      </select>

      <label>문구 입력 (줄바꿈/이모지 지원)</label>
      <textarea id="textInput" rows="3">소소한 일상 속,\n작은 행복 찾기 ☕</textarea>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <label>X 위치 (%)</label>
          <input type="range" id="posX" min="10" max="90" value="50">
        </div>
        <div>
          <label>Y 위치 (%)</label>
          <input type="range" id="posY" min="10" max="90" value="80">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
        <div>
          <label>크기 (px)</label>
          <input type="number" id="fontSize" value="40" min="10" max="120">
        </div>
        <div>
          <label>회전 (도)</label>
          <input type="number" id="rotation" value="0" min="-180" max="180">
        </div>
        <div>
          <label>글자 색상</label>
          <input type="color" id="textColor" value="#ffffff" style="height: 38px; padding: 2px;">
        </div>
      </div>
    </div>

    <!-- 4. 템플릿 관리 -->
    <div class="section">
      <h3>4. 템플릿 관리 (LocalStorage)</h3>
      <input type="text" id="tplName" placeholder="템플릿 이름 입력">
      <div class="btn-group">
        <button onclick="saveTemplate()">저장/수정</button>
        <button class="btn-danger" onclick="deleteTemplate()">삭제</button>
      </div>
      <select id="tplList" onchange="loadTemplate(this.value)">
        <option value="">-- 저장된 템플릿 불러오기 --</option>
      </select>
    </div>

    <!-- 5. 내보내기 -->
    <div class="section">
      <h3>5. 최종 내보내기</h3>
      <button style="background: linear-gradient(135deg, #38a169, #2f855a);" onclick="downloadImage()">🖼️ 이미지 내보내기 (PNG)</button>
    </div>

    <div id="toast"></div>
  </div>

  <!-- 우측 미리보기 영역 -->
  <div class="preview-area">
    <div class="canvas-wrapper">
      <canvas id="studioCanvas"></canvas>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('studioCanvas');
  const ctx = canvas.getContext('2d');
  let currentImg = null;

  const state = {
    ratio: '1:1',
    text: '소소한 일상 속,\n작은 행복 찾기 ☕',
    posX: 50,
    posY: 80,
    fontSize: 40,
    rotation: 0,
    textColor: '#ffffff'
  };

  const RATIOS = {
    '1:1': { w: 1080, h: 1080 },
    '4:5': { w: 1080, h: 1350 },
    '9:16': { w: 1080, h: 1920 }
  };

  const THEME_TEXTS = {
    daily: ["오늘도 수고한 나에게 작은 위로를 ☕", "평범함 속에서 발견하는 소소한 행복 🎈", "따스한 햇살이 반겨주는 평화로운 오늘 ☀️"],
    travel: ["새로운 풍경이 건네는 다정한 인사 ✈️", "길 위에서 만난 뜻밖의 선물 🌅", "발길 닿는 곳이 모두 나의 목적지 🗺️"],
    activity: ["한계를 넘어 도약하는 한 걸음 🧗‍♂️", "심장이 뛰는 대로 달려가는 거야 🏃‍♂️", "멈추지 않는 도전, 뜨거운 열정 🔥"],
    healing: ["지친 마음에 건네는 깊은 휴식 🌿", "잠시 멈춰 서서 자연의 숨결을 느껴봐요 🕊️", "생각은 비우고, 평온함으로 채우는 시간 🌊"],
    food: ["맛있는 음식은 삶의 가장 큰 즐거움 🍕", "오늘 한 끼도 완벽하게 행복하게 🍩", "좋은 사람과 함께하는 달콤한 식사 🍷"],
    motivation: ["내일의 내가 더 빛날 수 있도록 🌟", "작은 시도가 모여 커다란 기적을 만든다 💡", "스스로를 믿고 끝까지 직진하기 🔥"]
  };

  window.onload = () => {
    updateTemplateList();
    render();
  };

  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.className = isErr ? 'toast-error' : 'toast-success';
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => { currentImg = img; render(); showToast('이미지가 로드되었습니다.'); };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  function generateAIMessageOnly() {
    const theme = document.getElementById('themeSelect').value;
    const textPool = THEME_TEXTS[theme] || THEME_TEXTS.daily;
    const randomText = textPool[Math.floor(Math.random() * textPool.length)];
    state.text = randomText;
    document.getElementById('textInput').value = randomText;
    render();
    showToast('✨ AI 문구가 새로 추천되었습니다!');
  }

  document.getElementById('ratioSelect').addEventListener('change', e => { state.ratio = e.target.value; render(); });
  document.getElementById('textInput').addEventListener('input', e => { state.text = e.target.value; render(); });
  document.getElementById('posX').addEventListener('input', e => { state.posX = e.target.value; render(); });
  document.getElementById('posY').addEventListener('input', e => { state.posY = e.target.value; render(); });
  document.getElementById('fontSize').addEventListener('input', e => { state.fontSize = parseInt(e.target.value) || 20; render(); });
  document.getElementById('rotation').addEventListener('input', e => { state.rotation = parseInt(e.target.value) || 0; render(); });
  document.getElementById('textColor').addEventListener('input', e => { state.textColor = e.target.value; render(); });

  function render() {
    const dim = RATIOS[state.ratio];
    canvas.width = dim.w;
    canvas.height = dim.h;

    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (currentImg) {
      const imgRatio = currentImg.width / currentImg.height;
      const canvasRatio = canvas.width / canvas.height;
      let rw, rh, ox, oy;

      if (imgRatio > canvasRatio) {
        rh = canvas.height; rw = canvas.height * imgRatio;
        ox = (canvas.width - rw) / 2; oy = 0;
      } else {
        rw = canvas.width; rh = canvas.width / imgRatio;
        ox = 0; oy = (canvas.height - rh) / 2;
      }
      ctx.drawImage(currentImg, ox, oy, rw, rh);
    }

    if (state.text) {
      ctx.save();
      const targetX = canvas.width * (state.posX / 100);
      const targetY = canvas.height * (state.posY / 100);

      ctx.translate(targetX, targetY);
      ctx.rotate((state.rotation * Math.PI) / 180);

      ctx.fillStyle = state.textColor;
      ctx.font = `bold ${state.fontSize * 2}px 'Pretendard', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;

      const lines = state.text.split('\n');
      const lineHeight = state.fontSize * 2.5;
      const startY = -((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, idx) => {
        ctx.fillText(line, 0, startY + (idx * lineHeight));
      });

      ctx.restore();
    }
  }

  function downloadImage() {
    const a = document.createElement('a');
    a.download = `card_${state.ratio.replace(':', '_')}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('🖼️ 이미지 다운로드가 완료되었습니다.');
  }

  function saveTemplate() {
    const name = document.getElementById('tplName').value.trim();
    if (!name) return showToast('템플릿 이름을 입력하세요.', true);
    const store = JSON.parse(localStorage.getItem('card_studio_tpl') || '{}');
    store[name] = { ...state };
    localStorage.setItem('card_studio_tpl', JSON.stringify(store));
    showToast(`'${name}' 템플릿이 저장되었습니다.`);
    updateTemplateList();
  }

  function loadTemplate(name) {
    if (!name) return;
    const store = JSON.parse(localStorage.getItem('card_studio_tpl') || '{}');
    if (store[name]) {
      Object.assign(state, store[name]);
      document.getElementById('ratioSelect').value = state.ratio;
      document.getElementById('textInput').value = state.text;
      document.getElementById('posX').value = state.posX;
      document.getElementById('posY').value = state.posY;
      document.getElementById('fontSize').value = state.fontSize;
      document.getElementById('rotation').value = state.rotation;
      document.getElementById('textColor').value = state.textColor;
      render();
      showToast(`'${name}' 템플릿을 불러왔습니다.`);
    }
  }

  function deleteTemplate() {
    const name = document.getElementById('tplList').value;
    if (!name) return showToast('삭제할 템플릿을 선택하세요.', true);
    const store = JSON.parse(localStorage.getItem('card_studio_tpl') || '{}');
    delete store[name];
    localStorage.setItem('card_studio_tpl', JSON.stringify(store));
    showToast(`'${name}' 템플릿이 삭제되었습니다.`);
    updateTemplateList();
  }

  function updateTemplateList() {
    const list = document.getElementById('tplList');
    list.innerHTML = '<option value="">-- 저장된 템플릿 불러오기 --</option>';
    const store = JSON.parse(localStorage.getItem('card_studio_tpl') || '{}');
    Object.keys(store).forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.innerText = k;
      list.appendChild(opt);
    });
  }
</script>
</body>
</html>
